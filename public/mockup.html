const cartCalc = () => {
  const items = S.cart.map((c)=>({...c,p:PB(c.id)}));
  const sum = items.reduce((s,c)=>s+priceOf(c.p)*c.q,0);
  const cp = S.coupons.find((c)=>c.id===S.applied);
  let dc = 0;
  if (cp) { const base = cp.cat ? items.filter(c=>c.p.c===cp.cat).reduce((s,c)=>s+priceOf(c.p)*c.q,0) : sum; if (sum>=cp.min) dc = cp.rate ? Math.round(base*cp.rate) : cp.flat; }
  const ship = sum-dc>=50000||!sum ? 0 : 3000;
  return {items,sum,dc,ship,total:sum-dc+ship,cp};
};

// ---------- 라우터 ----------
const stack = [];
function go(route, push = true) {
  if (push && location.hash.slice(1) !== route) { location.hash = route; return; }
  const [name, ...args] = route.split('/');
  const fn = V[name] || V.home;
  document.getElementById('app').innerHTML = fn(...args.map(decodeURIComponent));
  window.scrollTo(0, 0);
  if (name === 'search') { const q = document.getElementById('sq'); q.addEventListener('keydown', (e) => { if (e.key === 'Enter') go('search/' + q.value.trim()); }); }
  tick();
}
window.addEventListener('hashchange', () => go(location.hash.slice(1) || 'home', false));
function tick() {
  const el = document.getElementById('cdn'); if (!el) return;
  const n = new Date(), end = new Date(n); end.setHours(15, 0, 0, 0);
  let s = Math.floor((end - n) / 1000);
  el.textContent = s > 0 ? `${Math.floor(s / 3600)}시간 ${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}분 남음` : '지금 주문 시 내일 출고';
}
setInterval(tick, 30000);

const A = {

  add: (d) => { addCart(+d.id); toast('장바구니에 담았어요'); },

  inc: (d) => { S.cart.find(c => c.id === +d.id).q++; go('cart', false); },

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a && A[a.dataset.act]) { if (a.tagName !== 'INPUT') e.preventDefault(); A[a.dataset.act](a.dataset, a); return; }
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); }
});
go(location.hash.slice(1) || 'home', false);
