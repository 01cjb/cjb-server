name: bootstrap
on:
  push:
    paths: ['bootstrap/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        run: |
          if [ ! -f bootstrap/repo.b64 ]; then echo "nothing to unpack"; exit 0; fi
          base64 -d bootstrap/repo.b64 > /tmp/repo.txz
          echo "f0128586925333fbed7eaa853d6e945f373dbddc41387e53b6c72494e9b461b5  /tmp/repo.txz" | sha256sum -c -
          tar -xJf /tmp/repo.txz
          git rm -r -q bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Collect Cafe24 orders into /work: OAuth connect, sync, unified order list"
          git push
