name: bootstrap
on:
  push:
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack cjb-server source
        run: |
          if [ ! -f bootstrap/repo.b64 ]; then echo "nothing to unpack"; exit 0; fi
          base64 -d bootstrap/repo.b64 > /tmp/repo.txz
          echo "aec31ba77612ef3ae22033d0dd3a1cec426e67140e063029beafa6e0dda57f4f  /tmp/repo.txz" | sha256sum -c -
          tar -xJf /tmp/repo.txz
          git rm -r -q bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Admin accounts: staff roles, test-to-company transition, grants migration"
          git push
