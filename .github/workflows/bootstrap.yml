name: bootstrap
on:
  push:
    paths: ['bootstrap/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        run: |
          if [ ! -f bootstrap/repo.b64 ]; then echo "nothing to unpack"; exit 0; fi
          base64 -d bootstrap/repo.b64 > /tmp/repo.txz
          echo "86d69834e4d515f753ddfd933e81a72d6894854b2a003570b3335678e6685e60  /tmp/repo.txz" | sha256sum -c -
          tar -xJf /tmp/repo.txz
          git rm -r -q bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add /work internal system: name/phone/PIN login, per-user menus, team menus"
          git push
