# CJB pipeline - see docs/PIPELINE.md
# PR:   app check + DB check (clean DB) + prod DB dry-run
# main: checks -> prod DB migrate -> /api/health smoke test
# Vercel deploys main by itself (Git integration) - no Vercel token needed
name: pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUPABASE_PROJECT_REF: sforkxsrudzidwdjoisw
  PROD_URL: https://cjb-server.vercel.app
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase db start
      - run: supabase db lint --local --level error --fail-on error

  db-plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: db
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --remote --dry-run

  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [app, db]
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --remote --dry-run
      - run: supabase db push --remote --yes

  smoke:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 120 # Vercel 배포 대기
          for i in 1 2 3 4 5 6 7 8; do
            body=$(curl -fsS "$PROD_URL/api/health" || true)
            echo "$body"
            if echo "$body" | jq -e '.ok == true and .db.ok == true' >/dev/null 2>&1; then exit 0; fi
            sleep 15
          done
          echo "::error::/api/health failed - check Vercel env vars / Supabase"
          exit 1
